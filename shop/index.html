<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop - ABJ</title>
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
  <div data-include="header"></div>
  <main id="main" class="container section">
    <h1 class="section-title">Shop</h1>
    <div class="shop-toolbar">
      <div class="chip-row">
        <span class="chip active">Alle</span>
        <span class="chip">Hoodies</span>
        <span class="chip">Jackets</span>
      </div>
    </div>
    <div class="product-grid">
      <article class="product-card">
        <div class="product-card-media"><a class="media-link" href="../product/"><span class="fake-img"></span></a></div>
        <div class="product-card-body"><span class="product-cat">Hoodie</span><h3 class="product-name"><a href="../product/">Classic Hoodie</a></h3><div class="product-price"><span class="price-now">CHF 69.00</span></div></div>
      </article>
    </div>
  </main>
  <div data-include="footer"></div>
  <script src="../assets/site.js"></script>
  <script src="../assets/includes.js"></script>
</body>
</html>
