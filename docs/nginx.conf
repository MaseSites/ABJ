# NGINX Configuration für ABJ Shop (PHP-Version) auf masesites.ch
# Speichern unter: /etc/nginx/sites-available/abj-shop
# Aktivieren mit: sudo ln -s /etc/nginx/sites-available/abj-shop /etc/nginx/sites-enabled/
# Danach: sudo nginx -t && sudo systemctl reload nginx
#
# Voraussetzungen auf dem Server:
#   sudo apt install php8.2-fpm php8.2-sqlite3
#   PHP-FPM Socket prüfen: ls /var/run/php/
#   Falls andere PHP-Version: upstream php_fpm Socket unten anpassen

# PHP-FPM Socket (an installierte PHP-Version anpassen)
upstream php_fpm {
  server unix:/var/run/php/php8.2-fpm.sock;
}

# HTTP -> HTTPS Redirect
server {
  listen 80;
  listen [::]:80;
  server_name masesites.ch www.masesites.ch;

  # Let's Encrypt Verification
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$server_name$request_uri;
  }
}

# HTTPS Server
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name masesites.ch www.masesites.ch;

  # Dokument-Root: PHP-Dateien liegen direkt hier (NICHT in src/public!)
  root /var/www/abj-shop;
  index index.php;

  # SSL Certificates (Let's Encrypt)
  ssl_certificate /etc/letsencrypt/live/masesites.ch/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/masesites.ch/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # Security Headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Logging
  access_log /var/log/nginx/abj-shop-access.log;
  error_log  /var/log/nginx/abj-shop-error.log;

  # Upload-Limit
  client_max_body_size 50M;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1000;
  gzip_types text/plain text/css text/xml text/javascript
             application/javascript application/json;

  # -------------------------------------------------------
  # Sensible Verzeichnisse sperren
  # -------------------------------------------------------
  location ~ ^/(data|lib|partials|src)/ {
    deny all;
    return 403;
  }

  # Versteckte Dateien sperren (.htaccess, .env, ...)
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  # -------------------------------------------------------
  # Statische Assets aus public/ ausliefern
  # -------------------------------------------------------
  location ~* ^/(css|js|img|assets)/(.+)$ {
    alias /var/www/abj-shop/public/$1/$2;
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ~* ^/uploads/(.+)$ {
    alias /var/www/abj-shop/public/uploads/$1;
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # -------------------------------------------------------
  # Saubere URLs -> PHP-Dateien (entspricht .htaccess)
  # -------------------------------------------------------

  # Startseite
  location = / {
    fastcgi_pass php_fpm;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    include fastcgi_params;
  }

  # Shop-Seiten
  location = /shop          { rewrite ^ /shop.php         last; }
  location = /warenkorb     { rewrite ^ /warenkorb.php    last; }
  location = /kasse         { rewrite ^ /kasse.php        last; }
  location = /kontakt       { rewrite ^ /kontakt.php      last; }
  location = /impressum     { rewrite ^ /impressum.php    last; }
  location = /datenschutz   { rewrite ^ /datenschutz.php  last; }
  location = /agb           { rewrite ^ /agb.php          last; }
  location = /widerruf      { rewrite ^ /widerruf.php     last; }
  location = /wunschliste   { rewrite ^ /wunschliste.php  last; }
  location = /newsletter    { rewrite ^ /newsletter.php   last; }
  location = /bestellung    { rewrite ^ /bestellung.php   last; }

  # Dynamische Produkt-URL
  location ~ ^/produkt/([^/]+)/?$ {
    rewrite ^ /produkt.php?slug=$1 last;
  }

  # Bestellung mit Referenz
  location ~ ^/bestellung/([^/]+)/?$ {
    rewrite ^ /bestellung.php?ref=$1 last;
  }

  # -------------------------------------------------------
  # Warenkorb & Checkout API
  # -------------------------------------------------------
  location = /warenkorb/api/add   { rewrite ^ /api/cart-add.php    last; }
  location = /warenkorb/api/state { rewrite ^ /api/cart-state.php  last; }
  location = /api/checkout        { rewrite ^ /api/checkout.php    last; }
  location = /api/stripe-webhook  { rewrite ^ /api/stripe-webhook.php last; }
  location = /api/produkte        { rewrite ^ /api/produkte.php       last; }
  location = /api/review          { rewrite ^ /api/review.php         last; }
  location = /api/discount-check  { rewrite ^ /api/discount-check.php last; }

  # -------------------------------------------------------
  # Admin-Bereich
  # -------------------------------------------------------

  # Admin API
  location ~ ^/admin/api/products/(\d+)$ {
    rewrite ^ /admin/api/products.php?id=$1 last;
  }
  location = /admin/api/products { rewrite ^ /admin/api/products.php last; }
  location = /admin/api/upload   { rewrite ^ /admin/api/upload.php   last; }

  # Admin-Seiten (clean URLs)
  location ~ ^/admin/?$                    { rewrite ^ /admin/index.php        last; }
  location = /admin/login                  { rewrite ^ /admin/login.php        last; }
  location = /admin/logout                 { rewrite ^ /admin/logout.php       last; }
  location = /admin/produkte               { rewrite ^ /admin/produkte.php     last; }
  location = /admin/bestellungen           { rewrite ^ /admin/bestellungen.php last; }
  location = /admin/lager                  { rewrite ^ /admin/lager.php        last; }
  location = /admin/nachrichten            { rewrite ^ /admin/nachrichten.php  last; }
  location = /admin/newsletter             { rewrite ^ /admin/newsletter.php   last; }
  location = /admin/einstellungen          { rewrite ^ /admin/einstellungen.php last; }
  location = /admin/rabatte                { rewrite ^ /admin/rabatte.php      last; }
  location = /admin/bewertungen            { rewrite ^ /admin/bewertungen.php  last; }
  location = /admin/kunden                 { rewrite ^ /admin/kunden.php       last; }
  location = /admin/produkt/neu            { rewrite ^ /admin/produkt-edit.php  last; }
  location ~ ^/admin/produkt/([0-9]+)/?$   { rewrite ^ /admin/produkt-edit.php?id=$1 last; }
  location ~ ^/admin/bestellung/([^/]+)/?$ { rewrite ^ /admin/bestellung.php?ref=$1  last; }
  location ~ ^/admin/lager/([0-9]+)/?$     { rewrite ^ /admin/lager-edit.php?id=$1   last; }

  # -------------------------------------------------------
  # PHP-Dateien ausführen (FastCGI)
  # -------------------------------------------------------
  location ~ \.php$ {
    try_files $uri =404;
    fastcgi_pass php_fpm;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
    fastcgi_read_timeout 60;
  }

  # -------------------------------------------------------
  # 404-Handler
  # -------------------------------------------------------
  error_page 404 /404.php;
  location = /404.php {
    fastcgi_pass php_fpm;
    fastcgi_param SCRIPT_FILENAME $document_root/404.php;
    include fastcgi_params;
    internal;
  }
}
